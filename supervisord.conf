[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
pidfile=/tmp/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ─── 1. 全流水线预测（一次性，不守护）───
[program:orchestrate_once]
command=python orchestrate.py --top-k 5
directory=/workspace
stdout_logfile=/workspace/logs/orchestrate.log
stderr_logfile=/workspace/logs/orchestrate.err
autostart=true
autorestart=false
startsecs=5

; ─── 2. 非随机性检测 + 先验向量（每 30 分钟循环）───
[program:nonrandom_loop]
command=bash -c "while true; do python nonrandomness_detector.py && python prior_vector.py; sleep 1800; done"
directory=/workspace
stdout_logfile=/workspace/logs/nonrandom_loop.log
stderr_logfile=/workspace/logs/nonrandom_loop.err
autostart=true
autorestart=true
startsecs=10

; ─── 3. 公式演化（每 1 小时跑 5 代）───
[program:evolution_loop]
command=bash -c "while true; do python formula_evolution.py --run --generations 5 --population 20; sleep 3600; done"
directory=/workspace
stdout_logfile=/workspace/logs/evolution_loop.log
stderr_logfile=/workspace/logs/evolution_loop.err
autostart=true
autorestart=true
startsecs=10

; ─── 4. 监控面板（常驻 8080）───
[program:monitor_dashboard]
command=python monitor_dashboard.py
directory=/workspace
stdout_logfile=/workspace/logs/monitor.log
stderr_logfile=/workspace/logs/monitor.err
autostart=true
autorestart=true
startsecs=5

; ─── 5. 沙箱唤醒（每 10 分钟）───
[program:wake_loop]
command=bash -c "while true; do ./wake_sandbox.sh; sleep 600; done"
directory=/workspace
stdout_logfile=/workspace/logs/wake_loop.log
stderr_logfile=/workspace/logs/wake_loop.err
autostart=true
autorestart=true
startsecs=5

; ─── Web 管理界面（可选，端口 9001）───
[inet_http_server]
port=0.0.0.0:9001
username=admin
password=yourpass