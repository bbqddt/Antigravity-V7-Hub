# cnb.yml —— CloudStudio 工作空间配置（保活示例）
#
# 作用：CloudStudio 支持在工作空间配置里设定「保活时间」，让空间在后台保持、
#       不立即休眠。配合 IDE 内「永不休眠」可实现常驻。
#
# 重要：下面为示例字段。CloudStudio 的 cnb.yml 具体键名/结构请以官方规范为准
#       （控制台「工作空间配置」通常可导出当前空间的真实配置，以导出为准覆盖本文件）。
#
# 关键点：
#   - 暴露你服务实际监听的端口（默认 3000，按需加 8080）
#   - 保活时间单位是毫秒；3600000ms = 1 小时。想更接近常驻可设更大，
#     或直接进 IDE 设置勾「永不休眠」。

spec:
  # 对外暴露的端口（与你的 3000 服务对应；如还有 8080 一并列出）
  ports:
    - 3000
    - 8080

  # 保活时间（示例键名，需对照官方规范核实）
  # 3600000ms = 1 小时
  keepAlive: 3600000

  # 若你的服务由 supervisord / 启动脚本拉起，可在此声明启动方式（示例）
  # startup: |
  #   supervisord -c /etc/supervisor/conf.d/sandbox.conf
