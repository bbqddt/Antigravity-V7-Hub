name: Antigravity Cloud Hermes 24/7 Node

on:
  schedule:
    # Run every 6 hours (just before GitHub Actions kills the long-running job)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests

      - name: Fetch Latest Truth
        run: |
          python skills/truth_fetcher.py

      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ssq_history_full.csv
          git commit -m "Automated Truth Sync: $(date)" || echo "No changes to commit"
          git push

      - name: Start Cloud Hermes Agent
        run: |
          python skills/cloud_hermes.py

