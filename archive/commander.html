<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity | 核心推演指挥部</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .status-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            border-left: 4px solid var(--primary);
        }

        .status-item {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .status-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--primary);
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 15px;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--secondary);
            color: white;
        }

        .ai-msg {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
        }

        /* Input Area */
        .input-area {
            padding: 30px;
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border);
        }

        #user-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        #user-input:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); filter: brightness(1.1); }

        select {
            background: #222;
            color: #fff;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            color: var(--primary);
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <div class="logo">ANTIGRAVITY</div>
            <div class="status-card">
                <div class="status-item">SYSTEM STATUS</div>
                <div class="status-val">READY / ENHANCED</div>
            </div>
            <div class="status-card" style="border-left-color: var(--secondary);">
                <div class="status-item">ARSENAL SOURCE</div>
                <div class="status-val">MULTI-LINK ACTIVATED</div>
            </div>
            
            <div style="margin-top: auto;">
                <label style="font-size: 12px; color: #888;">SELECT ORACLE</label>
                <select id="model-select">
                    <option value="meta/llama-3.3-70b-instruct">Llama-3.3-70B (Primary)</option>
                    <option value="gpt-4.6">GPT-4.6 (OpenRouter Pipeline)</option>
                    <option value="claude-3-5-sonnet">Claude 3.5 (Strategic)</option>
                    <option value="ollama/qwen-plus">Local Qwen (Ollama)</option>
                </select>
            </div>
        </div>

        <div class="chat-container">
            <div id="chat-messages">
                <div class="message ai-msg">
                    长官，欢迎来到【全维推演指挥部】。在这里，没有任何配额限制，没有任何官方枷锁。请下达您的推演指令。
                </div>
            </div>
            <div id="loading-indicator" class="loading" style="padding: 0 30px;">正在接通高维算力...</div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="输入推演指令..." onkeypress="if(event.keyCode==13) sendMessage()">
                <button onclick="sendMessage()">执行发射</button>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const model = document.getElementById('model-select').value;
            const messagesDiv = document.getElementById('chat-messages');
            const loading = document.getElementById('loading-indicator');
            
            if (!input.value.trim()) return;

            const userText = input.value;
            input.value = '';

            // User Message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-msg';
            userMsgDiv.textContent = userText;
            messagesDiv.appendChild(userMsgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            loading.style.display = 'block';

            try {
                const response = await fetch('/v1/chat/completions', {

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: userText }]
                    })
                });

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'message ai-msg';
                aiMsgDiv.innerHTML = aiText.replace(/\n/g, '<br>');
                messagesDiv.appendChild(aiMsgDiv);
            } catch (err) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai-msg';
                errorDiv.style.color = '#ff4444';
                errorDiv.textContent = '算力链路中断: ' + err.message;
                messagesDiv.appendChild(errorDiv);
            } finally {
                loading.style.display = 'none';
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }
    </script>
</body>
</html>
