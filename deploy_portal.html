<!DOCTYPE html>
<html>
<head>
    <title>Antigravity 离岸合龙门户</title>
    <style>
        body { background: #0f0f12; color: #00ffcc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding-top: 50px; }
        .box { border: 2px solid #00ffcc; padding: 30px; display: inline-block; box-shadow: 0 0 20px #00ffcc; background: #1a1a2e; border-radius: 10px; }
        button { background: #00ffcc; color: #000; border: none; padding: 15px 40px; font-size: 20px; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 30px #fff; }
        #log { margin-top: 20px; font-family: monospace; text-align: left; background: #000; padding: 10px; color: #0f0; min-width: 400px; max-height: 200px; overflow-y: auto; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔱 Antigravity Omega</h1>
        <p>离岸合龙协议 - 物理覆盖模式</p>
        <button onclick="deploy()">🚀 执行最终部署</button>
        <div id="log">等待指令...</div>
    </div>

    <script>
        const TOKEN = 'cfk_oJr91v0cX0OpaiDHa7JnRmKeydMblHCLP3RNxT4B394deeb4';
        const ACCOUNT_ID = '32f2cd6e781cdcda5144784ee5672c89';
        const SCRIPT_NAME = 'deploy';
        const CODE = `const TOKEN = '8516319664:AAGHq93N4uliC1QLeltXXD1dBtikguGnMnQ';
const CHAT_ID = '784753298';
async function handleRequest(request) {
  if (request.method === 'POST') {
    try {
      const payload = await request.json();
      if (payload.message && payload.message.text) {
        const text = payload.message.text.toLowerCase();
        if (text.includes('/status')) {
          await sendToTelegram('💠 *离岸态势*: Cloudflare Immortal Node Active\\n状态：7*24 绝对理性 (Tokyo Redirect)');
        } else if (text.includes('/strike') || text.includes('计算')) {
          await sendToTelegram('🔱 *Antigravity 26049 期推演*:\\n红球: [02, 09, 15, 23, 28, 31]\\n蓝球: [06]\\n战略: 流形频谱对冲已就绪。');
        }
      }
    } catch (e) {}
  }
  return new Response('OK');
}
async function sendToTelegram(text) {
  const url = \`https://api.telegram.org/bot\${TOKEN}/sendMessage\`;
  await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'Markdown' }) });
}
addEventListener('fetch', event => { event.respondWith(handleRequest(event.request)); });`;

        function log(msg) { document.getElementById('log').innerHTML += "<div>> " + msg + "</div>"; }

        async function deploy() {
            log("正在发起请求...");
            try {
                const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/javascript'
                    },
                    body: CODE
                });
                const res = await response.json();
                if (res.success) {
                    log("<span style='color:#0f0'>✅ 部署成功！离岸永生合龙。</span>");
                    alert("✅ 成功！请在 TG 中测试 /status");
                } else {
                    log("<span style='color:#f00'>❌ 失败: " + JSON.stringify(res.errors) + "</span>");
                }
            } catch (e) {
                log("<span style='color:#f00'>💥 错误: " + e.message + "</span>");
            }
        }
    </script>
</body>
</html>
