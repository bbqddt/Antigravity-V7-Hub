# render.yaml
services:
  - type: web
    name: antigravity
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: Asia/Shanghai
    healthCheckPath: /api/health
    autoDeploy: true